# 大模型配置
llm:
  model_name: qwen3.6-27b-q4
  think_tag_start: <think>
  model_path: F:/AI-Player/llm_api/qwen3.6-27b-q4/Qwen3.6-27B-UD-Q4_K_XL.gguf
  ctx_size: 51200
  max_tokens: 20480
  type_k: q8_0
  type_v: q8_0
  n_gpu_layers: 99
  # 通用任务下 思考模式推荐参数
  think_mode:
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repeat_penalty: 1.0
  # 通用任务下 非思考模式推荐参数
  non_think_mode:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repeat_penalty: 1.0